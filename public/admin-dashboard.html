<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ZenFlo Admin Dashboard</title>
<style>
  body { background:#0c1420; color:#e5ecf3; font-family:'DM Sans',Arial,sans-serif; margin:0; padding:24px; }
  h1 { color:#4fd1a5; }
  .cards { display:flex; gap:16px; flex-wrap:wrap; margin-bottom:24px; }
  .card { background:#16202f; padding:20px; border-radius:10px; min-width:160px; }
  .card .num { font-size:28px; font-weight:bold; color:#4fd1a5; }
  .card .label { font-size:13px; color:#8aa; margin-top:4px; }
  table { width:100%; border-collapse:collapse; background:#16202f; border-radius:10px; overflow:hidden; }
  th, td { padding:10px 14px; text-align:left; border-bottom:1px solid #2a3a4f; font-size:14px; }
  th { color:#8aa; text-transform:uppercase; font-size:12px; }
  .yes { color:#4fd1a5; }
  .no { color:#ff6b6b; }
  .delete-btn { background:#ff6b6b; color:#0c1420; border:none; padding:6px 12px; border-radius:6px; cursor:pointer; font-weight:bold; font-size:12px; }
  .delete-btn:hover { background:#ff4d4d; }
</style>
</head>
<body>
    <div style="display:flex; justify-content:space-between; align-items:center;">
    <h1>ZenFlo Admin</h1>
    <a href="/admin/logout" style="color:#8aa; font-size:13px; text-decoration:underline; cursor:pointer;">Log out</a>
  </div>
  <div class="cards" id="cards"></div>
  <section aria-label="Website traffic" style="margin-bottom:24px;">
    <h2>Website traffic <button id="refresh-traffic" type="button">Refresh traffic</button></h2>
    <p style="color:#8aa;font-size:13px;">ZenFlo website and app · admin and private routes excluded</p>
    <div id="traffic-status" role="status" aria-live="polite">Loading traffic…</div>
    <div class="cards" id="traffic-cards"></div>
    <p id="traffic-note" style="color:#8aa;font-size:12px;"></p>
  </section>
  <table>
    <thead>
      <tr>
        <th>Name</th><th>Email</th><th>Plan</th><th>Days since signup</th>
        <th>Brain dumps</th><th>Tasks</th><th>Check-ins</th><th>Used app?</th><th></th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <script>
    async function loadTraffic() {
      const button = document.getElementById('refresh-traffic');
      const status = document.getElementById('traffic-status');
      const cards = document.getElementById('traffic-cards');
      const note = document.getElementById('traffic-note');
      button.disabled = true;
      status.textContent = 'Loading traffic…';
      cards.replaceChildren(); note.textContent = '';
      try {
        const res = await fetch('/admin/traffic', { cache: 'no-store' });
        if (res.status === 401) { window.location.href = '/admin/login'; return; }
        if (!res.ok) throw new Error();
        const data = await res.json();
        if (!data.available) { status.textContent = data.message || 'Traffic reporting is temporarily unavailable.'; return; }
        status.textContent = '';
        for (const period of data.periods) {
          const card = document.createElement('article'); card.className = 'card';
          const heading = document.createElement('h3'); heading.textContent = period.days === 1 ? 'Today' : 'Last ' + period.days + ' days';
          const visitors = document.createElement('div'); visitors.className = 'num'; visitors.textContent = Number(period.visitors).toLocaleString() + ' visitors';
          const views = document.createElement('p'); views.textContent = Number(period.pageViews).toLocaleString() + ' page views';
          const range = document.createElement('p'); range.className = 'label'; range.textContent = period.startDate + ' – ' + period.endDate + ' UTC';
          card.append(heading, visitors, views, range); cards.appendChild(card);
        }
        note.textContent = 'Google Analytics · browser-based unique visitors, deduplicated within each period · includes today · consented traffic only · recent visits may take time to appear · refreshed ' + new Date(data.updatedAt).toLocaleString() + ' (cached up to 5 minutes)';
      } catch { status.textContent = 'Traffic reporting is temporarily unavailable.'; }
      finally { button.disabled = false; }
    }
    document.getElementById('refresh-traffic').addEventListener('click', loadTraffic);
    loadTraffic();

    async function load() {
      const res = await fetch('/admin/data');
      if (res.status === 401) return window.location.href = '/admin/login';
      const data = await res.json();
      const cardsDiv = document.getElementById('cards');
      cardsDiv.innerHTML = `
        <div class="card"><div class="num">${data.totals.total}</div><div class="label">Total signups</div></div>
        <div class="card"><div class="num">${data.totals.free}</div><div class="label">Free plan</div></div>
        <div class="card"><div class="num">${data.totals.pro}</div><div class="label">Pro plan</div></div>
        <div class="card"><div class="num">${data.totals.active}</div><div class="label">Actually used the app</div></div>
      `;
      const rowsBody = document.getElementById('rows');
      rowsBody.innerHTML = data.users.map(u => {
        const used = (u.brain_dump_count > 0 || u.task_count > 0 || u.checkin_count > 0);
        const days = Math.floor((Date.now() - new Date(u.created_at)) / 86400000);
        return `<tr>
          <td>${u.name}</td>
          <td>${u.email}</td>
          <td>${u.plan}</td>
          <td>${days}</td>
          <td>${u.brain_dump_count}</td>
          <td>${u.task_count}</td>
          <td>${u.checkin_count}</td>
          <td class="${used ? 'yes' : 'no'}">${used ? 'Yes' : 'No'}</td>
          <td><button class="delete-btn" onclick="deleteUser(${u.id}, '${u.name.replace(/'/g, "\\'")}')">Delete</button></td>
        </tr>`;
      }).join('');
    }

    async function deleteUser(id, name) {
      if (!confirm(`Are you sure you want to delete ${name}'s account? This cannot be undone.`)) return;
      const res = await fetch(`/admin/users/${id}`, { method: 'DELETE' });
      const data = await res.json();
      if (data.success) {
        load();
      } else {
        alert('Delete failed: ' + (data.error || 'Unknown error'));
      }
    }

    load();
  </script>
</body>
</html>
